spring.application.name=MoetazProject
server.port=8889

spring.datasource.url=jdbc:mysql://localhost:3306/sttgo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=mysql

# MQTT Configuration (modifiable par l'utilisateur si broker local)
mqtt.broker.url=tcp://mosquitto-broker:1883
mqtt.topic=citerne/mesure
mqtt.username=backend_sttgo
mqtt.password=sttgo_broker

# Mail Configuration (Example with Gmail)
# Pour Gmail, utilisez un "Mot de passe d'application"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=med9335@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# Frontend URL used in emails (change this to the real server IP/domain when deployed)
app.frontend.url=http://localhost